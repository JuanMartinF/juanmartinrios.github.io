    </div>
    
    <script>
      // Si el historial es menor o igual a 1, ocultamos el botón
      if (window.history.length <= 1) {
        document.getElementById("volver-atras").style.display = "none";
      }
    </script>
    

    <h2>Por un Tubo (fotografía)</h2>
    <p style="text-align:center; max-width:700px; margin:auto; margin-bottom:2rem;">
Fotografías de mis paletas a traves de un tubo solar. En proceso de digitalización.</p>

 
    
  <script>
    const collapsibles = document.querySelectorAll(".collapsible");
    collapsibles.forEach(btn => {
      btn.addEventListener("click", function() {
        this.classList.toggle("active");
        const content = this.nextElementSibling;
        if (content.style.display === "block") {
          content.style.display = "none";
        } else {
          content.style.display = "block";
        }
      });
    });
  </script>
